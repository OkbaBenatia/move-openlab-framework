[project]
name = "openlab-metric-example"
version = "1.0.0"
description = "Example MOVE OpenLab custom metric: CO2 avoided per served rider (computed from validated figures)"
requires-python = ">=3.11"
dependencies = []

# the platform finds metrics through this entry-point group; nothing else is configured
[project.entry-points."move_openlab.metrics"]
co2-avoided-per-served-rider = "openlab_metric_example:CO2_AVOIDED_PER_SERVED_RIDER"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openlab_metric_example"]
